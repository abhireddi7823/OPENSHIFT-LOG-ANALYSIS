name: OpenShift AI Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Verify Repository Structure
        run: |
          echo "Current Directory:"
          pwd

          echo "Repository Structure:"
          ls -R

      - name: Analyse OpenShift Logs
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
          AZURE_FOUNDRY_DEPLOYMENT: ${{ secrets.AZURE_FOUNDRY_DEPLOYMENT }}
        run: |
          python scripts/analyse_openshift_logs.py

      - name: Verify Generated Files
        run: |
          echo "Contents of docs folder"
          ls -lrt docs/

      - name: Publish Analysis to GitHub Summary
        run: |
          cat docs/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Commit Updated Dashboard
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add docs/

          git commit -m "Update OpenShift AI Dashboard" || echo "No changes to commit"

          git push origin main

      - name: Upload Analysis Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenShift-AI-Analysis
          path: docs/
